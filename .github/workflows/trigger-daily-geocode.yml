# Triggers the Cursor geocoding automation via webhook at the scheduled time.
# The cron line is advanced by +1 hour after each run (see reschedule_automation.py).
#
# Required GitHub secret: CURSOR_AUTOMATION_WEBHOOK_URL (from Cursor automation webhook settings)

name: Trigger daily geocoding

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cursor automation webhook
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "CURSOR_AUTOMATION_WEBHOOK_URL is not set; skipping webhook trigger."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","workflow":"trigger-daily-geocode"}'
